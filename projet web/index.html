<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Bibliothèque</title>
    
</head>
<body>
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* ============================================
   CONTAINER DE CONNEXION
============================================ */
.login-container {
    width: 100%;
    max-width: 420px;
    animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ============================================
   BOÎTE DE CONNEXION
============================================ */
.login-box {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.2);
    position: relative;
    overflow: hidden;
}

.login-box::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
}

/* ============================================
   EN-TÊTE
============================================ */
.login-box h1 {
    color: #2c3e50;
    text-align: center;
    font-size: 2.2rem;
    margin-bottom: 15px;
    font-weight: 700;
    position: relative;
    padding-bottom: 15px;
}

.login-box h1::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
    border-radius: 2px;
}

.login-box p {
    color: #7f8c8d;
    text-align: center;
    margin-bottom: 30px;
    font-size: 1rem;
    line-height: 1.6;
}

/* ============================================
   FORMULAIRE
============================================ */
.login-form {
    margin-top: 30px;
}

.form-group {
    margin-bottom: 25px;
    position: relative;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #2c3e50;
    font-weight: 600;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.form-group input {
    width: 100%;
    padding: 15px;
    border: 2px solid #e3e3e3;
    border-radius: 10px;
    font-size: 16px;
    transition: all 0.3s ease;
    background: #f8f9fa;
    color: #333;
}

.form-group input:focus {
    outline: none;
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    transform: translateY(-2px);
}

.form-group input::placeholder {
    color: #95a5a6;
    font-weight: 400;
}

/* ============================================
   BOUTON DE CONNEXION
============================================ */
.btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
}

.btn:active {
    transform: translateY(-1px);
}

.btn::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    background: rgba(255, 255, 255, 0.5);
    opacity: 0;
    border-radius: 100%;
    transform: scale(1, 1) translate(-50%);
    transform-origin: 50% 50%;
}

.btn:focus:not(:active)::after {
    animation: ripple 1s ease-out;
}

@keyframes ripple {
    0% {
        transform: scale(0, 0);
        opacity: 0.5;
    }
    100% {
        transform: scale(40, 40);
        opacity: 0;
    }
}

/* ============================================
   INFORMATIONS ET MESSAGES
============================================ */
.info {
    margin-top: 25px;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 10px;
    text-align: center;
    font-size: 14px;
    color: #666;
    border-left: 4px solid #667eea;
}

.info strong {
    color: #2c3e50;
    background: #e8eaf6;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 600;
}

.message {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    font-weight: 600;
    font-size: 14px;
    animation: slideIn 0.3s ease;
    transition: all 0.3s ease;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ============================================
   EFFETS DE FOCUS ET VALIDATION
============================================ */
.form-group input:valid {
    border-color: #2ecc71;
}

.form-group input:invalid:not(:placeholder-shown) {
    border-color: #e74c3c;
}

/* ============================================
   DÉCORATIONS SUPPLÉMENTAIRES
============================================ */
.login-box {
    position: relative;
}

.login-box::after {
    content: '📚';
    position: absolute;
    top: -20px;
    right: -20px;
    font-size: 80px;
    opacity: 0.1;
    transform: rotate(15deg);
}

/* ============================================
   RESPONSIVE DESIGN
============================================ */
@media (max-width: 480px) {
    .login-container {
        padding: 15px;
    }
    
    .login-box {
        padding: 30px 25px;
    }
    
    .login-box h1 {
        font-size: 1.8rem;
    }
    
    .login-box p {
        font-size: 0.9rem;
    }
    
    .form-group input {
        padding: 14px;
    }
    
    .btn {
        padding: 15px;
    }
}

/* ============================================
   ANIMATION DE CHARGEMENT
============================================ */
.loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 1s ease-in-out infinite;
    margin-right: 10px;
    vertical-align: middle;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ============================================
   EFFET DE PULSATION POUR LE BOUTON
============================================ */
.btn.pulse {
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% {
        box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7);
    }
    70% {
        box-shadow: 0 0 0 10px rgba(102, 126, 234, 0);
    }
    100% {
        box-shadow: 0 0 0 0 rgba(102, 126, 234, 0);
    }
}

/* ============================================
   EFFET DE FLOU PENDANT LA CONNEXION
============================================ */
.blur {
    filter: blur(5px);
    pointer-events: none;
    opacity: 0.7;
    transition: all 0.3s ease;
}

/* ============================================
   TOOLTIP POUR LES INFORMATIONS
============================================ */
.tooltip {
    position: relative;
    display: inline-block;
    cursor: help;
}

.tooltip .tooltiptext {
    visibility: hidden;
    width: 200px;
    background-color: #2c3e50;
    color: #fff;
    text-align: center;
    border-radius: 6px;
    padding: 10px;
    position: absolute;
    z-index: 1;
    bottom: 125%;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity 0.3s;
    font-size: 12px;
    font-weight: normal;
}

.tooltip .tooltiptext::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    margin-left: -5px;
    border-width: 5px;
    border-style: solid;
    border-color: #2c3e50 transparent transparent transparent;
}

.tooltip:hover .tooltiptext {
    visibility: visible;
    opacity: 1;
}
    </style>
    <div class="login-container">
        <div class="login-box">
            <h1>📚 Bibliothèque Complète</h1>
            <p>Gestion complète : Livres, Auteurs, Catégories, Adhérents, Emprunts</p>
            
            <div class="login-form">
                <div class="form-group">
                    <label>Nom d'utilisateur</label>
                    <input type="text" id="username" placeholder="admin">
                </div>
                
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" placeholder="123456">
                </div>
                
                <button onclick="seConnecter()" class="btn">Se Connecter</button>
                
                <p class="info">Utilisez : <strong>admin / 123456</strong></p>
                <p id="message" class="message"></p>
            </div>
        </div>
    </div>

    <script>
        function seConnecter() {
            let username = document.getElementById('username').value;
            let password = document.getElementById('password').value;
            let message = document.getElementById('message');
            
            if (username === 'admin' && password === '123456') {
                message.textContent = '✅ Connexion réussie !';
                message.style.color = 'green';
                
                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                message.textContent = '❌ Identifiants incorrects';
                message.style.color = 'red';
            }
        }
        
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                seConnecter();
            }
        });
    </script>
</body>
</html>
